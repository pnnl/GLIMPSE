# GLIMPSE hosted frontend + reverse proxy. Stands in for the ALB locally, and
# works as-is on a single EC2 instance.

# No upstream block on purpose. nginx resolves a name in `upstream` once, at
# config load, and caches the result for the life of the process — so a replica
# started or replaced later never receives traffic, and nginx keeps dialling the
# address of one that has gone away. Both were observed here: with three
# replicas up, one served zero requests while nginx logged "connection refused"
# against a stale address.
#
# Instead the backend host goes through a variable, which forces nginx to
# re-resolve per request against Docker's embedded DNS. Docker returns the live
# replica addresses in rotating order, giving plain round-robin with no ip_hash
# and no sticky cookie — which is the property this stack exists to test.
# An ALB tracks its targets itself, so this only matters locally.

# Compress JSON hard: a parsed CIM model is ~27 MB raw and ~4 MB gzipped.
gzip on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_vary on;

server {
    listen 80;
    server_name _;
    # Local TLS testing uses the mkcert/self-signed pair mounted at /etc/nginx/certs.
    # Comment the redirect out to serve plain HTTP.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Populated at startup by 45-glimpse-tls.sh: mounted certs if present,
    # otherwise a generated self-signed pair.
    ssl_certificate     /etc/nginx/tls/glimpse.crt;
    ssl_certificate_key /etc/nginx/tls/glimpse.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Must be at least the backend's MAX_UPLOAD_MB, or nginx 413s a CIM upload
    # before Flask ever sees it. IEEE 9500 alone is 56 MB.
    client_max_body_size 128m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 127.0.0.11 is Docker's embedded DNS. A short TTL keeps the replica list
        # current as containers come and go.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $glimpse_backend backend;
        # $request_uri is required: with a variable in proxy_pass, nginx stops
        # appending the matched path itself.
        proxy_pass http://$glimpse_backend:5052$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Already-gzipped responses (precomputed examples, job results) must pass
        # through untouched rather than being re-encoded.
        proxy_set_header Accept-Encoding $http_accept_encoding;

        # Uploading 56 MB takes a while; and without a job store configured the
        # parse itself happens on this request.
        client_body_timeout 300s;
        proxy_send_timeout  300s;
        proxy_read_timeout  1800s;
        proxy_request_buffering off;
    }

    # Health check, kept off the SPA fallback.
    location = /healthz {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $glimpse_health backend;
        proxy_pass http://$glimpse_health:5052/;
        access_log off;
    }
}

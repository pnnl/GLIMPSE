services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend
        environment:
            FLASK_HOST: 0.0.0.0
            FLASK_PORT: "5052"
            CORS_ORIGINS: "${CORS_ORIGINS:-}"
            GLIMPSE_API_TOKEN: "${GLIMPSE_API_TOKEN:-}"
            GRIDAPPSD_ADDRESS: "${GRIDAPPSD_ADDRESS:-host.docker.internal}"
            GRIDAPPSD_PORT: "${GRIDAPPSD_PORT:-61613}"
            GRIDAPPSD_USER: "${GRIDAPPSD_USER:-system}"
            GRIDAPPSD_PASSWORD: "${GRIDAPPSD_PASSWORD:-manager}"
            CIMG_URL: "${CIMG_URL:-}"
        ports:
            - "5052:5052"
        volumes:
            - ./models:/app/models:ro
        extra_hosts:
            - "host.docker.internal:host-gateway"

    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        environment:
            API_URL: "${API_URL:-http://127.0.0.1:5052}"
            API_TOKEN: "${GLIMPSE_API_TOKEN:-}"
        ports:
            - "5173:80"
        depends_on:
            - backend

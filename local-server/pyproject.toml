[project]
name = "local-server"
version = "0.8.8"
description = "Back end server for GLIMPSE for GLM, CIM, JSON parsing and other functionalities through API or Websocket events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cim-graph",
    "SPARQLWrapper",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "flask-socketio>=5.6.0",
    "gevent>=25.9.1",
    "gevent-websocket>=0.10.1",
    "gridappsd-python",
    "jsonschema>=4.26.0",
    "pyinstaller",
    "requests>=2.28.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
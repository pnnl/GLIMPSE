[project]
name = "local-server"
version = "0.8.6"
description = "Back end server for GLIMPSE for GLM, CIM, JSON parsing and other functionalities through API or Websocket events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cim-graph",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "flask-socketio>=5.6.0",
    "gevent>=25.9.1",
    "gevent-websocket>=0.10.1",
    "gridappsd-python",
    "jsonschema>=4.26.0",
    "pyinstaller",
    "requests>=2.28.2",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
]

[dependency-groups]
# celery is a hosted-only runtime dependency (see requirements-hosted.txt), but
# the parse-job tests exercise the task module, so it belongs in the dev group.
dev = ["pytest>=8.0", "celery[redis]>=5.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Both suites, named explicitly: "tests" alone would collect the server tests and
# silently skip the parser's, which live inside the glmparser package.
testpaths = ["tests", "glmparser/tests"]

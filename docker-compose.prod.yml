services:
    redis:
        image: redis:7-alpine
        command: >
            redis-server --save ""
            --appendonly no
            --maxmemory ${REDIS_MAXMEMORY:-6gb}
            --maxmemory-policy noeviction
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend.hosted
            args:
                PRECOMPUTE_EXAMPLES: "${PRECOMPUTE_EXAMPLES:-ieee123 glm3000 ieee9500}"
        environment:
            GLIMPSE_MODE: hosted
            GLIMPSE_REDIS_URL: redis://redis:6379/0
            CORS_ORIGINS: "${CORS_ORIGINS:-https://localhost}"
            GLIMPSE_API_TOKEN: "${GLIMPSE_API_TOKEN:-}"
            MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-128}"
            GLIMPSE_JOB_TTL: "${GLIMPSE_JOB_TTL:-3600}"
            GLIMPSE_MAX_QUEUE_DEPTH: "${GLIMPSE_MAX_QUEUE_DEPTH:-24}"
        expose:
            - "5052"
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'python -c "import urllib.request;urllib.request.urlopen(''http://127.0.0.1:5052/'')"',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        mem_limit: 1g

    worker:
        build:
            context: .
            dockerfile: Dockerfile.backend.hosted
            args:
                PRECOMPUTE_EXAMPLES: "${PRECOMPUTE_EXAMPLES:-ieee123 glm3000 ieee9500}"
        # --concurrency 1: a parse peaks near 600 MB, so one at a time per
        # container keeps a worker inside mem_limit. Add throughput with
        # `--scale worker=N` (or more tasks on a larger instance), not with
        # concurrency on a 2 GB box.
        command:
            [
                "celery",
                "-A",
                "tasks",
                "worker",
                "--queues",
                "glimpse.parse",
                "--concurrency",
                "${WORKER_CONCURRENCY:-1}",
                "--loglevel",
                "info",
            ]
        environment:
            GLIMPSE_MODE: hosted
            GLIMPSE_REDIS_URL: redis://redis:6379/0
            GLIMPSE_JOB_TTL: "${GLIMPSE_JOB_TTL:-3600}"
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            # CMD-SHELL, not CMD: the node name has to be expanded, and it must
            # name *this* container. A bare `inspect ping` passes as long as any
            # worker on the broker replies, so a wedged replica would look
            # healthy because a sibling answered for it.
            test: ["CMD-SHELL", "celery -A tasks inspect ping -d celery@$$(hostname) --timeout 10"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        mem_limit: 2g
        # Longer than the task time limit would be ideal, but a deploy cannot
        # wait 30 minutes: acks_late means a parse cut short here is redelivered
        # to another worker rather than lost, so this only bounds how long a
        # deploy waits for a parse that is nearly done.
        stop_grace_period: 120s

    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        environment:
            API_URL: ""
            API_TOKEN: "${GLIMPSE_API_TOKEN:-}"
            GLIMPSE_MODE: hosted
        ports:
            - "8080:80"
            - "8443:443"
        volumes:
            - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/certs:/etc/nginx/certs:ro
        depends_on:
            - backend
